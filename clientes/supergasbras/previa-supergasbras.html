<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basemaps Supergasbras</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
@font-face{font-family:Marca;src:url(data:font/ttf;base64,) format("truetype")}
:root{--bg:#F3F3F3;--ink:#222222;--sec:#5F5F5F;--acc:#D33100}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:16px max(3vw,14px);background:var(--ink);color:var(--bg)}
h1{font:400 26px/1 Marca,system-ui;margin:0;letter-spacing:.02em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tabs button{font:600 14px system-ui;padding:10px 16px;border-radius:6px;border:1px solid var(--bg);background:transparent;color:var(--bg);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px max(3vw,14px)}
figure{margin:0}
figcaption{font-weight:600;margin:0 0 6px}
.mapa{height:min(68vh,620px);border-radius:6px;overflow:hidden;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.pal{display:flex;flex-wrap:wrap;gap:6px;padding:4px max(3vw,14px) 10px}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px 4px 4px;border-radius:5px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.sw i{width:22px;height:22px;border-radius:4px;border:1px solid #0002;display:block}
details{padding:0 max(3vw,14px) 18px;font-size:14px}
details input{font:16px system-ui;width:min(100%,520px);padding:8px;margin:6px 0;border:1px solid var(--sec);border-radius:5px}
details button{font:600 14px system-ui;padding:9px 14px;border:0;border-radius:5px;background:var(--ink);color:var(--bg);cursor:pointer}
#aviso{display:none;margin:0 max(3vw,14px) 10px;padding:10px 12px;border-radius:6px;background:#fff3cd;color:#5c4400}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}.mapa{height:52vh}.tabs{margin-left:0}}
</style>
</head>
<body>
<header><h1>Supergasbras · basemaps</h1><nav class="tabs" id="tabs"></nav></header>
<div id="aviso"></div>

const PALETAS = {"claro": {"fundo": "#f5f5f5", "agua": "#c5dee8", "verde": "#ddeddd", "uso_especial": "#f0f0f0", "edificacoes": "#d1d1d1", "via_menor": "#fdfdfd", "via_principal": "#ffffff", "rodovia": "#fdd3c8", "contorno_via": "#dbdbdb", "ferrovia": "#b7b7b7", "limites": "#8c8c8c", "rotulo_forte": "#222222", "rotulo_medio": "#5b5b5b", "rotulo_fraco": "#808080", "halo": "#f5f5f5", "pois": {"blue": "#54789c", "green": "#56805f", "lapis": "#64739e", "pink": "#976373", "red": "#9a6460", "slategray": "#4d7a9a", "tangerine": "#95694c", "turquoise": "#3c8181"}}, "colorido": {"fundo": "#e6e6e6", "agua": "#8dc4da", "verde": "#b5d7b5", "uso_especial": "#dfdfdf", "edificacoes": "#bababa", "via_menor": "#f7f7f7", "via_principal": "#fdfdfd", "rodovia": "#fca38e", "contorno_via": "#c2c2c2", "ferrovia": "#9e9e9e", "limites": "#D33100", "rotulo_forte": "#222222", "rotulo_medio": "#4d4d4d", "rotulo_fraco": "#696969", "halo": "#ededed", "pois": {"blue": "#316ca5", "green": "#317a45", "lapis": "#5064a8", "pink": "#9b4b66", "red": "#9f4d48", "slategray": "#1870a1", "tangerine": "#985521", "turquoise": "#0e7878"}}, "escuro": {"fundo": "#191919", "agua": "#011118", "verde": "#162516", "uso_especial": "#1d1d1d", "edificacoes": "#353535", "via_menor": "#2e2e2e", "via_principal": "#404040", "rodovia": "#ba5a44", "contorno_via": "#141414", "ferrovia": "#3d3d3d", "limites": "#696969", "rotulo_forte": "#F3F3F3", "rotulo_medio": "#b7b7b7", "rotulo_fraco": "#8c8c8c", "halo": "#191919", "pois": {"blue": "#83a8cf", "green": "#85b18e", "lapis": "#93a3d1", "pink": "#ca93a3", "red": "#cd948f", "slategray": "#7cabcc", "tangerine": "#c8997b", "turquoise": "#6eb3b2"}}, "satelite": {"fundo": "#222222", "agua": "#000d14", "verde": "#162516", "uso_especial": "#1d1d1d", "edificacoes": "#353535", "via_menor": "#2e2e2e", "via_principal": "#cecece", "rodovia": "#d7907f", "contorno_via": "#161616", "ferrovia": "#3d3d3d", "limites": "#d7d7d7", "rotulo_forte": "#F3F3F3", "rotulo_medio": "#b7b7b7", "rotulo_fraco": "#8c8c8c", "halo": "#161616", "pois": {"blue": "#97c2f0", "green": "#99cda3", "lapis": "#a9bcf2", "pink": "#eaa9bb", "red": "#edaaa4", "slategray": "#8ec5ec", "tangerine": "#e7b18c", "turquoise": "#7dcece"}}};
const NOMES = {claro:"Claro", colorido:"Colorido", escuro:"Escuro", satelite:"Satélite"};
const protocolo = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocolo.tile);
let variante = "claro", fonte = null;
const aviso = document.getElementById("aviso");

function estiloCom(v){
  const s = structuredClone(ESTILOS[v]);
  if (fonte) {
    s.sources.protomaps = fonte.startsWith("http")
      ? {...s.sources.protomaps, url: "pmtiles://" + fonte}
      : {...s.sources.protomaps, url: "https://api.protomaps.com/tiles/v4.json?key=" + encodeURIComponent(fonte)};
  }
  return s;
}
const mapas = [
  new maplibregl.Map({container:"m1", style:estiloCom(variante), center:[-48.6,-22.3], zoom:5.9, attributionControl:{compact:true}}),
  new maplibregl.Map({container:"m2", style:estiloCom(variante), center:[-46.63,-23.58], zoom:11.2, attributionControl:{compact:true}}),
];
mapas.forEach(m => {
  m.addControl(new maplibregl.NavigationControl({showCompass:false}));
  m.on("error", e => {
    const msg = String(e && e.error && e.error.message || "");
    if (/pmtiles|fetch|Failed|403|404/i.test(msg)) {
      aviso.textContent = "Os tiles não carregaram (" + msg.slice(0,120) + "). Abra o painel 'Fonte dos tiles' no fim da página e informe outra fonte.";
      aviso.style.display = "block";
    }
  });
});

function desenhar(){
  document.getElementById("tabs").innerHTML = Object.keys(NOMES).map(v =>
    `<button data-v="${v}" aria-pressed="${v===variante}">${NOMES[v]}</button>`).join("");
  const p = PALETAS[variante];
  document.getElementById("pal").innerHTML = Object.entries(p).filter(([k,c]) => typeof c === "string")
    .map(([k,c]) => `<span class="sw"><i style="background:${c}"></i>${k.replace("_"," ")} <b>${c}</b></span>`).join("");
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  variante = b.dataset.v; desenhar();
  mapas.forEach(m => m.setStyle(estiloCom(variante)));
});
document.getElementById("aplicar").addEventListener("click", () => {
  fonte = document.getElementById("fonte").value.trim() || null;
  aviso.style.display = "none";
  mapas.forEach(m => m.setStyle(estiloCom(variante)));
});
desenhar();
}
</script>
